<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Polaris Penumbra — CSS designs, HTML snippets and tutorials.">
  <title>Cave CSS | Polaris Penumbra</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/script.js" defer></script>
</head>
<body class="content-page" data-page="cave_css">
<main class="container">
    <h3 class="page-title">Cave CSS</h3>
    <div class="cards">
      <article class="card">
        <img class="card-image" src="/images/landscape.svg" alt="CSS design preview" width="640" height="360">
        <div class="card-body">
          <h3>Card title 1</h3>
          <div>
            <span class="field-label" id="label-link-1-1">Link</span>
            <div class="copy-row">
              <div class="link-field" id="link-1-1" role="textbox" aria-readonly="true" aria-labelledby="label-link-1-1" tabindex="0">https://example.com</div>
              <button type="button" class="copy-button" data-copy="link-1-1">Copy</button>
            </div>
          </div>
          <div class="credits">
            Credits:
            <ul>
              <li>Image author: <a href="https://example.com/author" target="_blank" rel="noopener noreferrer">Author name</a></li>
              <li>Font author: <a href="https://example.com/font" target="_blank" rel="noopener noreferrer">Author name</a></li>
            </ul>
          </div>
        </div>
      </article>
    </div>
  </main>
  <div id="status" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
